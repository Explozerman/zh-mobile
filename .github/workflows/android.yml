name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r27c
  GRADLE_VERSION: '8.11.1'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with the pinned DXVK fork)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build meson glslang-tools pkg-config nasm yasm \
            autoconf autoconf-archive automake libtool gperf bison flex
          meson --version; glslangValidator --version | head -1

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: vcpkg
        run: |
          # Full clone of current vcpkg: the manifest pins versions via builtin-baseline +
          # overrides (ffmpeg 8.1.1), whose version-database entries only exist in newer trees.
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'cmake/triplets/arm64-android-zh.cmake') }}
          restore-keys: vcpkg-android-

      - name: Configure (CMake preset android-arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          cmake --preset android-arm64 2>&1 | tee configure.log

      - name: Build engine + DXVK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          cmake --build build/android-arm64 --target z_generals dxvk_d3d8_install -- -k 0 2>&1 | tee build.log


      - name: Stage native libraries + assets
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./scripts/build/android/stage-native-libs.sh build/android-arm64
          ./scripts/build/android/stage-assets.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PzhVersionCode=${{ github.run_number }} \
            -PzhVersionName=0.1.${{ github.run_number }}
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/zh-mobile-0.1.${{ github.run_number }}.apk
          ls -la out 2>&1 | tee gradle-out.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zh-mobile-apk
          path: out/*.apk

      - name: Upload unstripped libraries (for crash symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: |
            build/android-arm64/**/libmain.so
            build/android-arm64/libdxvk_d3d*.so
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZH Mobile 0.1.${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: |
            Test build ${{ github.run_number }} (commit ${{ github.sha }}).

            **RU:** Скачайте APK на телефон и установите. Файлы игры не входят — импортируйте их из своей копии игры через лаунчер.
            **EN:** Download the APK on your phone and install it. No game data is included — import it from your own copy of the game in the launcher.

      # The agent working on this port cannot download Actions logs directly, so the
      # logs (configure, build, failing vcpkg ports) are pushed to the ci-logs branch.
      - name: Publish CI logs to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-logs/run-${{ github.run_number }}
          D=/tmp/ci-logs/run-${{ github.run_number }}
          for f in configure.log build.log gradle-out.log; do [ -f "$f" ] && cp "$f" "$D/"; done
          if [ -f build.log ]; then
            grep -nE "error:|error [A-Z]|undefined reference|undefined symbol|FAILED:|fatal error" build.log | head -400 > "$D/errors.txt" || true
          fi
          # vcpkg port failures keep their own logs in buildtrees
          if [ -d "$HOME/vcpkg/buildtrees" ]; then
            find "$HOME/vcpkg/buildtrees" -maxdepth 2 -name "*-err.log" -size +0 -newer configure.log 2>/dev/null \
              | head -20 | while read -r f; do cp "$f" "$D/vcpkg-$(basename "$(dirname "$f")")-$(basename "$f")"; done || true
            find "$HOME/vcpkg/buildtrees" -maxdepth 2 -name "*-out.log" -newer configure.log 2>/dev/null \
              | head -20 | while read -r f; do tail -c 200000 "$f" > "$D/vcpkg-$(basename "$(dirname "$f")")-$(basename "$f")"; done || true
          fi
          find build/android-arm64 -path "*dxvk-build-android/meson-logs/meson-log.txt" -exec cp {} "$D/dxvk-meson-log.txt" \; 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > "$D/STATUS"
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "zh-mobile-ci"; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin ci-logs && git reset -q FETCH_HEAD || true
          git add "run-${{ github.run_number }}" && git commit -qm "logs for run ${{ github.run_number }}" && git push -q origin HEAD:ci-logs
