# ZH Mobile — DXVK runtime configuration (copied to GameData/dxvk.conf by the launcher)
#
# Same stability baseline as the macOS/iOS builds.
d3d9.forceSamplerTypeSpecConstants = False

# Anisotropic filtering keeps the shallow-angle RTS terrain sharp. 8x is a good
# balance for phones; the original port uses 16x on Apple GPUs.
d3d9.samplerAnisotropy = 8

# The engine simulates at 30 Hz; capping presentation at 60 fps saves battery
# and heat on phones with 120 Hz panels.
d3d9.maxFrameRate = 60

# Logging is controlled by the launcher (DXVK_LOG_LEVEL); keep the file log off.
dxvk.logLevel = warn
