# ZH Mobile — DXVK runtime configuration (copied to GameData/dxvk.conf by the launcher)
#
# Same stability baseline as the macOS/iOS builds.
d3d9.forceSamplerTypeSpecConstants = False

# Anisotropic filtering keeps the shallow-angle RTS terrain sharp. 8x is a good
# balance for phones; the original port uses 16x on Apple GPUs.
d3d9.samplerAnisotropy = 8

# The engine simulates at 30 Hz; capping presentation at 60 fps saves battery
# and heat on phones with 120 Hz panels.
d3d9.maxFrameRate = 60

# Logging is controlled by the launcher (DXVK_LOG_LEVEL); keep the file log off.
dxvk.logLevel = error

# Android: an ANativeWindow accepts only one VkSurfaceKHR at a time, and the engine
# creates its D3D device twice during startup. Create the surface at first present
# (and recreate it after the app returns from the background) instead of at device
# creation, so a short-lived first device never holds the window.
d3d9.deferSurfaceCreation = True

# Android: no background defragmentation of device-local memory. After ~20 minutes
# of play the S23 FE crashed in DxvkMemoryAllocator::createAllocation with the
# allocation free list overwritten by a stale reference-count write, i.e. a freed
# allocation object still in use. Defragmentation (which relocates live resources)
# is the allocator path desktop drivers rarely exercise and mobile UMA heaps do.
dxvk.enableMemoryDefrag = False
